// No-camera patch.
// Camera ("intel") input path ON: the fake hand (sixense.dll proxy) feeds it.
// If controls freeze, set this to 0 to fall back to plain keyboard/mouse.
sixense_intel_enabled 1

// ALT is the fake hand (hold = grab / move / rotate); keep E for normal use.
unbind ALT
bind e +use
// R is the rotate modifier (Alt + R + mouse); was swap_ss_input (split-screen)
unbind r

echo "[nocamera] intel input on, ALT = fake hand, ALT+R = rotate"
