// No-camera patch.
// Camera ("intel") input path ON: the webcam hand (tracker + sixense.dll proxy) feeds it.
// If controls freeze, set this to 0 to fall back to plain keyboard/mouse.
sixense_intel_enabled 1

// Older versions unbound R (used by the removed ALT+R mouse hand): restore it.
bind r swap_ss_input

echo "[nocamera] intel input on - start tracker\run.bat for the hand"
