; Fake-hand settings (read at game start). Copied next to sixense.dll.
[hand]
; 1 = log every hand frame to nocam_hand.log
log_nodes=0
; openness reported while carrying (game: scaled to 1 = holds and can rotate)
hold_openness=2
; webcam tracker (tracker/run.bat): data older than this is ignored, ms
camera_timeout_ms=300
; fingertip height above the palm, metres: it aims the portal gun (0.08 = points up)
tip_height=0.045
; 0 = hold to carry (close = grab, open = drop); 1 = original toggle
; (close = grab, open = keep holding and rotate, close again = drop)
toggle_grab=0
