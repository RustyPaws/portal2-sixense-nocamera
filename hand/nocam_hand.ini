; Fake-hand settings (read at game start). Copied next to sixense.dll.
[hand]
; set to 1 to flip an axis
invert_x=0
invert_y=0
invert_tilt_x=0
invert_tilt_y=0
; metres of hand movement per mouse count / per wheel notch
move_scale=0.0006
depth_step=0.03
; hold with Alt to rotate instead of move: a letter (R) or VK number (16 = Shift)
rotate_key=R
; radians per mouse count / per wheel notch while rotating
tilt_scale=0.004
roll_step=0.15
; resting hand distance from the camera, metres
rest_depth=0.45
; 1 = an open hand is always visible when Alt is up
hand_always=1
; 1 = log every hand frame to nocam_hand.log
log_nodes=0
; 1 = every Alt grab can rotate (press R any time); 0 = must press R before Alt
alt_open=1
; openness reported while holding (game: <=1 after x0.9 = holds, >0.5 = can rotate) -> 2
hold_openness=2
